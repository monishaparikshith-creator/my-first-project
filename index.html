<!DOCTYPE html>
<html>
<head>
    <title>One Market</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .buttons {
            text-align: center;
            margin: 20px;
        }

        .buttons button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login {
            background: #2563eb;
            color: white;
        }

        .signup {
            background: #16a34a;
            color: white;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            text-align: center;
        }

        .price {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>🛒 One Market</h1>
    <p>Buy. Sell. Give Back.</p>
</header>

<div class="buttons">
    <a href="login.html">
        <button class="login">Login</button>
    </a>

    <a href="signup.html">
        <button class="signup">Sign Up</button>
    </a>
</div>

<h2 style="text-align:center;">Featured Products</h2>

<div class="products">

    <div class="card">
        <h3>📱 iPhone</h3>
        <p class="price">₹25,000</p>
    </div>

    <div class="card">
        <h3>💻 Laptop</h3>
        <p class="price">₹40,000</p>
    </div>

    <div class="card">
        <h3>🎧 Headphones</h3>
        <p class="price">₹2,000</p>
    </div>

</div>

</body>
</html>
